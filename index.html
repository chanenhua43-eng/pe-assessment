<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中體育課堂真實情境診斷量表 (50分鐘版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4">
  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">高中體育課堂真實情境診斷量表</h1>
      <p class="text-slate-600">透過 6 個高中體育課（50分鐘）真實決策情境，評估您的教學信念落點與後續優化策略</p>
    </header>

    <!-- Quiz Card Container -->
    <div id="quiz-card" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
      <!-- Dynamic Content rendered by JS -->
    </div>
  </div>

  <script>
    const quizData = [
      {
        id: 1,
        title: "情境一：課堂說明與動作示範 (時間配置與 ALT-PE)",
        scenario: "今天要教授排球「低手傳球」，高中課堂時間共 50 分鐘，學生剛集合完畢。在準備介紹動作要領時，您最常採取的課堂節奏是？",
        options: [
          { text: "(A) 講精、練熟：花 12–15 分鐘完整講解與示範動作要領及常犯錯誤，確保全班建立正確動作概念後，再分組排隊練習。", type: "direct", score: 1 },
          { text: "(B) 精簡、多動：只用 3–5 分鐘交代 2 個核心動作口訣並示範，迅速將全班散開至多個球網練習，確保練習時間達 25 分鐘 (50%) 以上，邊練邊個別指導。", type: "literacy", score: 3 },
          { text: "(C) 探索、後總結：先不示範標準動作，直接發球給學生分組嘗試「把球連續過網 3 次」，等學生發現問題後，再集合進行動作教學。", type: "construct", score: 2 }
        ],
        element: "1. 建立在有效教學的基礎上",
        theory: "體育有效教學理論 (ALT-PE, Siedentop & Tannehill)",
        idealIdx: 1,
        advices: {
          direct: "在 50 分鐘的高中課堂中，講解超過 10 分鐘容易吞噬學生的有效練習時間（ALT-PE）。建議採用 KISS 原則（單次講解控制在 3-5 分鐘內），並增加器材組數（如多組球網），讓學生有 25 分鐘 (50%) 以上的時間在動手練習。",
          construct: "探索式教學能激發興趣，但若缺乏基礎鷹架，高中學生容易形成錯誤動作習慣。建議在探索前給予 1–2 個關鍵提示詞（Key Cues），引導有效探索。",
          literacy: "您具備極佳的高 ALT-PE 有效教學概念！建議未來練習時，可搭配『專一且具體的資訊回饋』（如：『很好，剛剛擊球時手臂有打直！』）來強化動作記憶。"
        }
      },
      {
        id: 2,
        title: "情境二：教學活動設計 (技能練習型態)",
        scenario: "籃球單元來到「運球突破」主題，在安排個人/小組練習活動時，您的主要設計邏輯是？",
        options: [
          { text: "(A) 基礎軌跡重複練習：規劃直線與 S 型繞錐運球，讓學生在無干擾的固定軌跡下反覆練習，先把手感與運球節奏練穩。", type: "direct", score: 1 },
          { text: "(B) 實戰擬真決策練習：安排 1 對 1 限區突破或多對少過關遊戲，允許防守者進行動態干擾，讓學生練習「看防守、找空間」再運球。", type: "literacy", score: 3 },
          { text: "(C) 全場完整規則對抗：簡短複習後直接進行 5 對 5 比賽，讓學生在完整的比賽規則與真實對抗中體會運球突破的時機。", type: "construct", score: 2 }
        ],
        element: "2. 在學習過程中構思學以致用的情境",
        theory: "情境學習理論與生態動態觀 (Situated Cognition & Perception-Action Coupling)",
        idealIdx: 1,
        advices: {
          direct: "孤立的閉鎖式技能練習（如單純繞錐）難以遷移至實戰。建議在練習中引入『限制條件動態防守者』，讓學生訓練『觀察—決策—執行』的生態感知能力。",
          construct: "直接進行 5 對 5 對抗容易讓運動能力較弱的學生邊緣化。建議先透過『簡化遊戲 (Modified Games)』進行動態決策練習。",
          literacy: "您的課堂極具實戰情境感！可嘗試在練習暫停時加入提問（如：『剛才防守者留下什麼空間？』），引導學生進行戰術決策反思。"
        }
      },
      {
        id: 3,
        title: "情境三：學習目標與評量重點 (全人發展導向)",
        scenario: "在規劃田徑/排球等單元的學習目標與期末評量時，您最重視的指標是？",
        options: [
          { text: "(A) 技能與體能成果：以個人的運動技術表現（如過網成功率、運球時間）與體適能進步幅度為主要評量依據。", type: "direct", score: 1 },
          { text: "(B) 技能與團隊素養並重：評量技術進步的同時，也明確納入「分組討論策略、溝通合作、隊友失誤時的正向對話」等社會態度。", type: "literacy", score: 3 },
          { text: "(C) 參與度與運動樂趣：只要學生上課全程積極參與、展現運動熱情、能透過課堂活動抒發壓力，即給予高分評價。", type: "construct", score: 2 }
        ],
        element: "3. 考量孩子整體性的發展",
        theory: "個人與社會責任模式 (TPSR Model, Hellison) & 全人教育",
        idealIdx: 1,
        advices: {
          direct: "體育課不只是練身體。建議將『情意與社會互動目標』顯性化（例如明確告知今日目標包含：『隊友失誤時給予一次正向鼓勵』），發揮全人育人價值。",
          construct: "僅關注樂趣容易讓課堂停留在『育樂活動』。建議結合具體的社會責任指標（如 TPSR 模式），讓樂趣與個人/社會責任成長並進。",
          literacy: "您成功將體育課提升至全人發展層次！可試著引進『角色輪替制度』（紀錄員、策略教練、裁判），讓每位孩子在團隊中展現多維度價值。"
        }
      },
      {
        id: 4,
        title: "情境四：差異化教學與任務設定 (能力落差)",
        scenario: "班上學生的運動能力落差極大，面對「有些學生已經會打，有些連球都接不到」的狀況，您的標準作法是？",
        options: [
          { text: "(A) 統一標準與規範：設定全班統一的球網高度與測驗門檻，引導能力較弱的學生努力達到基本標準。", type: "direct", score: 1 },
          { text: "(B) 教師彈性分組分級：由老師根據平日觀察，直接將全班分為「基礎組」與「進階組」，給予不同的練習項目與指令。", type: "construct", score: 2 },
          { text: "(C) 設計階梯與學生自選：提供 3 種不同難度的場地或任務卡（如不同高度網/重量球），由學生自行評估並選擇適合自己的挑戰。", type: "literacy", score: 3 }
        ],
        element: "4. 給予選擇的機會，教導選擇適合的活動",
        theory: "自我決定論 (Self-Determination Theory - Autonomy & Competence)",
        idealIdx: 2,
        advices: {
          direct: "統一標準容易讓弱者挫折、強者無聊。建議設計 2–3 種難度的『階梯任務』，並教導學生自我評估，建立自主選擇權。",
          construct: "由教師直接分組雖能照顧差異，但可能帶給學生被標籤化的感覺。嘗試給予學生自主決定挑戰難度的機會，能大幅提升內在學習動機。",
          literacy: "您給予了學生極佳的自主權與勝任感！下一步可引導學生嘗試『自訂個人學習目標』，學習對自己的學習成果負責。"
        }
      },
      {
        id: 5,
        title: "情境五：單元結束的學習期待 (身體素養遷移)",
        scenario: "一個為期 6 週的羽球單元進入尾聲，您最希望學生離開這門課後帶走什麼？",
        options: [
          { text: "(A) 標準動作與測驗成績：能掌握精準的發球與擊球動作技術，並在期末測驗中取得優異成績。", type: "direct", score: 1 },
          { text: "(B) 運動習慣與生活連結：不僅懂技術與規則，還能主動了解社區球場資源、建立與同伴在課餘時間約打球的興趣與習慣。", type: "literacy", score: 3 },
          { text: "(C) 規則理解與賽事觀賞：熟知羽球比賽規則與判罰，並能看懂國際比賽的精采之處與戰術應用。", type: "construct", score: 2 }
        ],
        element: "5. 以身體素養為最終目標",
        theory: "身體素養架構 (Physical Literacy Framework, Whitehead)",
        idealIdx: 1,
        advices: {
          direct: "技術測驗不等於終身運動。建議在單元末安排『課外延伸任務』（如：調查學校周邊場地預約方式、設計個人一週運動計畫），連結課外真實生活。",
          construct: "懂得欣賞賽事是很好的認知收穫。若能再鼓勵學生將知識轉化為『課餘約打球』的實際行動，更能落實身體素養的終身參與目標。",
          literacy: "您落實了身體素養的終極關懷！可進一步鼓勵學生記錄『自主運動日誌』，養成自我健康管理與終身參與運動的自信。"
        }
      },
      {
        id: 6,
        title: "情境六：教學模式與課堂風格 (多元教學法)",
        scenario: "面對不同特質的班級，您在設計整堂課的架構與引導方式時，通常偏向哪種風格？",
        options: [
          { text: "(A) 結構化直接教學：採取「教師示範 → 統一帶領練習 → 巡迴修正 → 單元測驗」的系統化教學流程，確保秩序與學習效率。", type: "direct", score: 1 },
          { text: "(B) 模組化多元教學：依單元特性彈性採用不同模式（如：球類項目用「戰術遊戲法 TGFU」、團體單元用「運動教育模式 SEM」）。", type: "literacy", score: 3 },
          { text: "(C) 自由探索與自主活動：提供多樣運動器材，由學生自行決定每節課要從事何種活動，教師主要扮演安全維護與秩序維護者。", type: "construct", score: 2 }
        ],
        element: "6. 使用不同的課程模式與教學法",
        theory: "模式導向體育教學 (Model-Based Instruction, Metzler)",
        idealIdx: 1,
        advices: {
          direct: "單一直接教學法容易讓學生學習疲乏。建議嘗試引進『戰術遊戲法 (TGFU)』（先透過簡化遊戲引發問題，再教技術），大幅提升學習動機與戰術理解。",
          construct: "過度放任自由活動容易失去教學目標。建議可導入『運動教育模式 (SEM)』，在有結構的季賽與分工角色中，讓學生享有高度自主性。",
          literacy: "您具備豐富的多元教學模組概念！可嘗試結合『運動教育模式 (SEM)』設計 6 週賽季，建立高凝聚力的班級運動文化。"
        }
      }
    ];

    let userAnswers = Array(quizData.length).fill(null);
    let currentStep = 0;

    function renderQuiz() {
      const card = document.getElementById("quiz-card");
      const current = quizData[currentStep];

      let optionsHTML = current.options.map((opt, idx) => `
        <label class="block p-4 mb-3 border-2 rounded-xl cursor-pointer transition-all ${userAnswers[currentStep] === idx ? 'border-indigo-600 bg-indigo-50/50' : 'border-slate-200 hover:border-slate-300'}">
          <div class="flex items-start">
            <input type="radio" name="option" value="${idx}" ${userAnswers[currentStep] === idx ? 'checked' : ''} onchange="selectOption(${idx})" class="mt-1 text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-slate-700 leading-relaxed">${opt.text}</span>
          </div>
        </label>
      `).join('');

      card.innerHTML = `
        <div class="flex justify-between items-center mb-4 text-sm font-medium text-slate-500">
          <span>決策情境 ${currentStep + 1} / ${quizData.length}</span>
          <span>完成度 ${Math.round(((currentStep + 1) / quizData.length) * 100)}%</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2 mb-6">
          <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${((currentStep + 1) / quizData.length) * 100}%"></div>
        </div>

        <h2 class="text-xl font-bold text-slate-900 mb-3">${current.title}</h2>
        <div class="mb-6 bg-slate-50 p-4 rounded-lg border-l-4 border-indigo-500 text-slate-700 leading-relaxed">
          ${current.scenario}
        </div>

        <div class="mb-8">${optionsHTML}</div>

        <div class="flex justify-between">
          <button onclick="prevStep()" ${currentStep === 0 ? 'disabled class="opacity-0 pointer-events-none"' : ''} class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 font-medium hover:bg-slate-50">上一題</button>
          <button onclick="nextStep()" ${userAnswers[currentStep] === null ? 'disabled class="opacity-50 cursor-not-allowed bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium"' : 'class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-md shadow-indigo-200"'}>
            ${currentStep === quizData.length - 1 ? '產生診斷報告' : '下一題'}
          </button>
        </div>
      `;
    }

    function selectOption(idx) {
      userAnswers[currentStep] = idx;
      renderQuiz();
    }

    function prevStep() {
      if (currentStep > 0) { currentStep--; renderQuiz(); }
    }

    function nextStep() {
      if (currentStep < quizData.length - 1) {
        currentStep++;
        renderQuiz();
      } else {
        renderResult();
      }
    }

    function renderResult() {
      const card = document.getElementById("quiz-card");

      // 計算各類型次數
      let counts = { direct: 0, construct: 0, literacy: 0 };
      userAnswers.forEach((chosenIdx, qIdx) => {
        if (chosenIdx !== null) {
          let type = quizData[qIdx].options[chosenIdx].type;
          counts[type]++;
        }
      });

      let total = quizData.length;
      let literacyPct = Math.round((counts.literacy / total) * 100);
      let directPct = Math.round((counts.direct / total) * 100);
      let constructPct = Math.round((counts.construct / total) * 100);

      let mainStyle = counts.literacy >= 4 ? "素養導向型 (Literacy-Oriented)" : counts.direct >= 3 ? "傳統結構奠基型 (Structure-Based)" : "建構與探索導向型 (Construct-Based)";

      let reportDetails = quizData.map((q, idx) => {
        let chosenIdx = userAnswers[idx];
        let chosenOpt = q.options[chosenIdx];
        let isIdeal = chosenIdx === q.idealIdx;
        let adviceText = q.advices[chosenOpt.type];

        return `
          <div class="mb-6 p-5 rounded-xl border ${isIdeal ? 'border-emerald-200 bg-emerald-50/30' : 'border-amber-200 bg-amber-50/30'}">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <h4 class="font-bold text-slate-800">${q.title}</h4>
              <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${isIdeal ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                核心要素：${q.element.split('.')[0]}
              </span>
            </div>
            <p class="text-xs text-indigo-700 font-medium mb-3">📚 理論依據：${q.theory}</p>
            <p class="text-sm text-slate-600 mb-3 bg-white/80 p-2.5 rounded border border-slate-100">
              <strong>您的課堂決策：</strong>${chosenOpt.text}
            </p>
            <div class="text-sm bg-white p-3.5 rounded-lg border border-slate-200/80 text-slate-700 leading-relaxed">
              <strong class="text-slate-900 block mb-1">💡 高中課堂優化與行動指引：</strong>
              ${adviceText}
            </div>
          </div>
        `;
      }).join('');

      // 產生純 HTML + Inline CSS 視覺化長條
      let barHTML = `
        <div style="display: flex; height: 28px; width: 100%; border-radius: 14px; overflow: hidden; background-color: #e2e8f0; margin-bottom: 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);">
          ${literacyPct > 0 ? `<div style="width: ${literacyPct}\%; background-color: #4f46e5; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;">${literacyPct}%</div>` : ''}
          ${constructPct > 0 ? `<div style="width: ${constructPct}\%; background-color: #f59e0b; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;">${constructPct}%</div>` : ''}
          ${directPct > 0 ? `<div style="width: ${directPct}\%; background-color: #94a3b8; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;">${directPct}%</div>` : ''}
        </div>
      `;

      card.innerHTML = `
        <div class="text-center mb-8">
          <h2 class="text-2xl font-bold text-slate-900 mb-2">高中體育教學想像報告 (50分鐘)</h2>
          <p class="text-slate-600 mb-6">您的主導教學信念風格為：<span class="font-bold text-indigo-600">${mainStyle}</span></p>

          <!-- 視覺化傾向條區塊 -->
          <div class="bg-slate-100 p-5 rounded-2xl max-w-lg mx-auto text-left mb-6 border border-slate-200">
            <div class="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">教學信念傾向比例視覺化：</div>
            
            ${barHTML}

            <div class="flex justify-between items-center text-xs text-slate-700 font-medium pt-1">
              <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-indigo-600 inline-block mr-1.5 shadow-sm"></span>素養導向 (${literacyPct}%)</span>
              <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block mr-1.5 shadow-sm"></span>建構探索 (${constructPct}%)</span>
              <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-slate-400 inline-block mr-1.5 shadow-sm"></span>結構奠基 (${directPct}%)</span>
            </div>
          </div>
        </div>

        <h3 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">6 大核心要素深度診斷與優化指引</h3>
        ${reportDetails}

        <div class="text-center mt-8">
          <button onclick="restartQuiz()" class="bg-slate-800 hover:bg-slate-900 text-white px-8 py-3 rounded-xl font-medium shadow-md transition-all">重新進行診斷</button>
        </div>
      `;
    }

    function restartQuiz() {
      userAnswers = Array(quizData.length).fill(null);
      currentStep = 0;
      renderQuiz();
    }

    // Initialize Quiz on page load
    renderQuiz();
  </script>
</body>
</html>
